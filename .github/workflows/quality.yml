name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check

  repository-adapter:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: blabla-macos-arm64
          - os: ubuntu-latest
            artifact: blabla-linux-x64
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3
      - working-directory: cli
        run: dart pub get --enforce-lockfile
      - working-directory: cli
        run: dart format --output=none --set-exit-if-changed .
      - working-directory: cli
        run: dart analyze
      - working-directory: cli
        run: dart test
      - working-directory: cli
        run: mkdir -p dist
      - working-directory: cli
        run: dart compile exe bin/blabla.dart -o dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cli/dist/${{ matrix.artifact }}
          if-no-files-found: error
