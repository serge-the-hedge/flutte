name: Release CLI

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: blabla-macos-arm64
          - os: ubuntu-latest
            artifact: blabla-linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3
      - working-directory: cli
        run: dart pub get --enforce-lockfile
      - working-directory: cli
        run: mkdir -p dist
      - working-directory: cli
        run: >-
          dart compile exe --define=BLABLA_CLI_VERSION="${GITHUB_REF_NAME#v}"
          bin/blabla.dart -o dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cli/dist/${{ matrix.artifact }}
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: >-
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
